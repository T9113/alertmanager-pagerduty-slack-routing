global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-notifications'
  routes:
  - match:
      severity: critical
    receiver: 'pagerduty-high-priority'

receivers:
- name: 'slack-notifications'
  slack_configs:
  - channel: '#alerts-ops'
    send_resolved: true
- name: 'pagerduty-high-priority'
  pagerduty_configs:
  - service_key: 'PAGERDUTY_INTEGRATION_KEY'
